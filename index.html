<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickLink | URL Shortener</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="card">

        <div class="logo">
            🔗
        </div>

        <h1>QuickLink</h1>

        <p>
            Transform long URLs into short, shareable links.
        </p>

        <form action="/shorten" method="POST">

            <div class="input-box">

                <input
                    type="url"
                    name="url"
                    placeholder="https://example.com/your-long-url"
                    required
                >

            </div>

            <button type="submit">
                Shorten URL
            </button>

        </form>


        {{if .ShortURL}}

        <div class="result">

            <p>
                ✓ Your shortened URL is ready
            </p>

            <a
                href="{{.ShortURL}}"
                target="_blank"
            >
                {{.ShortURL}}
            </a>

        </div>

        {{end}}


        <div class="footer">
            <span>QuickLink</span> · Fast · Simple · Reliable
        </div>

    </div>

</body>

</html>
